<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرر جدول الامتحانات</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#1e2a3a;--mut:#6b7b8f;--line:#dfe6ee;--pri:#0b5c9e;--pribg:#e6eef6;--pill:#edf1f6;--ok:#2e8a57;--okbg:#d9f0e2;--warn:#c0392b;--warnbg:#fdeeee;--lil:#e7e3f6;--amb:#b9650f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:baseline;margin-inline-end:12px}.brand b{font-size:12px;color:var(--mut);border-inline-end:1px solid var(--line);padding-inline-end:10px}.brand span{font-size:19px;font-weight:700;color:var(--pri)}
.pill{background:var(--pill);border-radius:20px;padding:4px 14px;font-size:13px;color:var(--mut)}.pill b{color:var(--ink);margin-inline-start:4px}.pill.bad{background:var(--warnbg);color:var(--warn);font-weight:600}.pill.ok{background:var(--okbg);color:var(--ok)}
.grow{flex:1}.saved{color:var(--ok);font-size:12px;font-weight:600}.saved:before{content:"● "}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-weight:600;color:var(--ink)}.btn:hover{background:var(--pill)}
.btn.pri,.pri{background:var(--pri);border:0;color:#fff;border-radius:8px;padding:8px 16px;font-weight:600}.btn.pri:hover{background:#094a82}
.tabsr{display:flex;gap:6px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line)}
.tabsr button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 18px 11px;font-weight:600;color:var(--ink)}.tabsr button.on{color:var(--pri);border-color:var(--pri)}
.tabsr em{font:600 11px/1 inherit;font-style:normal;background:var(--pill);border-radius:10px;padding:3px 8px;margin-inline-start:6px;color:var(--mut)}.tabsr .on em{background:var(--pribg);color:var(--pri)}
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 24px}
.tool .bar{display:flex;flex:1;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tool input{border:1px solid var(--line);background:var(--bg);padding:6px 10px;border-radius:8px}
.wrap{direction:ltr;display:grid;grid-template-columns:310px 1fr;gap:16px;padding:0 24px 24px;align-items:start}.wrap>*{direction:rtl}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.side section{border-bottom:1px solid var(--line);padding-bottom:6px}
.side h3{margin:0;padding:10px 14px;font-size:14px;background:#f8fafc;color:var(--pri);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid var(--line)}
.side h3 label{font-size:11px;color:var(--mut);font-weight:400}.tot{width:58px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px}
.cr{margin:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:grab;background:#fff;display:flex;flex-direction:column;gap:2px}
.cr:hover{border-color:var(--pri)}.cr:active{cursor:grabbing}.cr small{color:var(--mut);font-size:12px}.cr.pick{outline:2px solid var(--pri)}
.cr.done{background:#f8fafc;opacity:.7}.cr i{font-size:11px;font-style:normal;background:var(--okbg);color:var(--ok);border-radius:10px;padding:1px 8px;align-self:flex-start}
.main{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
th{background:#f1f5f9;color:var(--mut);font-size:13px}th.tt{font-size:20px;background:#fff;color:var(--pri);padding:12px}
tbody.day td{border-top-color:var(--line)}tbody.day{border-top:3px solid var(--pribg)}.slot.over td{background:var(--pribg)}tr.slot:not(.first) td.tm{border-top:2px solid var(--pribg)}
td.nm{font-weight:700}td.dp{font-weight:600}
.chip{display:block;font-size:11px;line-height:1.7;border-radius:10px;margin-top:3px;font-weight:600}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:#fff3e0;color:var(--amb)}.chip.bad{background:var(--warn);color:#fff}
#rdd{position:fixed;z-index:60;display:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:220px;overflow:auto}#rdd .ri{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 10px;font-size:13px;cursor:pointer}#rdd .ri:hover,#rdd .ri.act{background:var(--pribg)}#rdd .ri.occ{background:rgba(192,57,43,.09)}#rdd .ri.occ:hover,#rdd .ri.occ.act{background:rgba(192,57,43,.2)}#rdd small{font-size:11px;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}@media print{#rdd{display:none!important}}
input.er,input.en{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 6px;text-align:center}input.er{width:96px}input.en{width:64px}.en-note{font-size:11px;color:var(--amb);max-width:160px;margin:2px auto 0}
.rw{color:var(--amb);font-weight:700;cursor:help}@media print{.rw{display:none}}
.x{border:0;background:none;color:#9aa8b8;padding:0 4px}.x:hover{color:var(--warn)}
input.pf{width:100%;border:0;background:none;text-align:center;color:var(--ink)}
.ghost{background:#fff;border:1px dashed #b8c6d6;border-radius:8px;padding:3px 12px;color:var(--pri);font-weight:600}.ghost:hover{background:var(--pribg)}
.dz{color:var(--mut);background:#f8fafc;font-size:12px;cursor:pointer;padding:5px}.empty{color:var(--mut)}.addc{background:#fbfcfe}
.af{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;direction:rtl}.af input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;width:110px}.af .rn{width:76px}
.slot.blk td{background:var(--warnbg)}.slot.blk .dz{color:var(--warn);font-weight:600}.sdt{border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:#fff;max-width:140px}.cm{flex-basis:100%;font-size:12px;text-align:start;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:4px 8px}.cm.i{color:var(--pri);background:var(--pribg)}.cm.n{color:var(--mut);background:none;padding:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:260px}}
@media print{.top,.tabsr,.tool,.side,.np,.x{display:none!important}.wrap{display:block;padding:0}.main{border:0}body{background:#fff}th,.chip{background:#fff!important;color:#000!important}th,td{border-color:#000}}
#pk,#xl{position:fixed;inset:0;z-index:80;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;padding:16px}#pk.on,#xl.on{display:flex}
.pkc{background:var(--card);border-radius:14px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.pkh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px;color:var(--pri)}
.pkc section{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}.pkc section:last-child{border:0}
.pkc h4{margin:0;font-size:14px}.pkc p{margin:0;color:var(--mut);font-size:12px}
.pkc label{display:flex;flex-direction:column;gap:4px;width:100%;font-size:12px;color:var(--mut)}.pkc label input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink)}
.pkl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.pkl img{height:40px}
.pkw{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;margin:12px 18px 0;font-size:12px}
.pri:disabled{opacity:.5;cursor:default}@media print{#pk,#xl{display:none!important}}
</style></head><body>
<header class="top"><div class="brand"><b>HTI</b><span>محرر جدول الامتحانات</span></div>
<span class="pill">المواعيد:<b id="pS">0</b></span><span class="pill">الامتحانات:<b id="pE">0</b></span><span class="pill" id="pL">غير موزّع:<b>0</b></span>
<div class="grow"></div><span class="saved">محفوظ محلياً</span>
<button class="btn" data-a="clear">مسح الجدول</button><button class="btn" data-a="impd">استيراد البيانات الأصلية</button><button class="btn" data-a="imps">استيراد جدول الامتحانات</button><button class="btn pri" data-a="exp">تنزيل جدول الامتحانات</button><input type="file" id="fileD" accept=".json,application/json" hidden><input type="file" id="fileS" accept=".json,application/json" hidden></header>
<nav class="tabsr" id="tabs"></nav>
<div class="tool"><div class="bar"><b>موعد جديد</b><input type="date" id="sd"><input type="time" id="sf" value="10:00"><span>إلى</span><input type="time" id="st" value="13:00"><button class="pri" data-a="slot">+ إضافة موعد</button></div><span class="pill" id="prog"></span><button class="btn" data-a="xlsx">تصدير Excel</button><button class="btn" data-a="pk">كشوف التوقيعات والأغلفة</button></div>
<div class="wrap"><aside class="side" id="side"></aside><div class="main" id="main"></div></div>
<datalist id="rl"></datalist><datalist id="pl"></datalist><div id="rdd"></div><div id="toast"></div><div id="pk"></div><div id="xl"></div>
<script>
let D={y:{},rooms:[],profs:[]};try{const x=JSON.parse(localStorage.getItem("hti-data-v1"));if(x&&x.y)D=x}catch(e){}
const KEY="hti-exams-v1";let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{slots:[],exams:[],def:{},tot:{},yr:1};
const ui={add:null,pick:null};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const YN=["","الاولى","الثانية","الثالثة","الرابعة"];
const norm=s=>s.replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/(^|\s)ال/g,"$1").replace(/\s+/g," ").trim();
const rk=s=>String(s||"").replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[\s\-_.]+/g,"").toLowerCase();
const tm=t=>{const[a,b]=t.split(":");return a*60+ +b};
const t12=t=>{const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+" "+(h<12?"ص":"م")},trg=(a,b)=>t12(a)+" الى "+t12(b);
const fd=d=>{const[y,m,x]=d.split("-");return +x+"/"+ +m+"/"+y};
const dn=d=>new Date(d+"T12:00:00").toLocaleDateString("ar-EG",{weekday:"long"});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const say=(t,ms=2600)=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove("on"),ms)};
const tot=(d,y=S.yr)=>S.tot[y+d]??D.y[y]?.[d]?.t??0;
const asg=(e,d)=>e.rows.filter(r=>r.d==d).reduce((a,r)=>a+r.n,0);
const sl=id=>S.slots.find(s=>s.id==id),ex=id=>S.exams.find(e=>e.id==id);
const yslots=()=>S.slots.filter(s=>s.yr==S.yr);
function placed(d,n,y=S.yr){const k=norm(n);for(const e of S.exams){const s=sl(e.slot);if(s&&s.yr==y&&e.key==k&&e.depts.includes(d))return fd(s.date)+" "+t12(s.from)}return""}
function conf(room,e){const s=sl(e.slot),k=rk(room),o=[];if(!k)return o;
 S.exams.forEach(x=>{if(x.id==e.id)return;const t=sl(x.slot);if(!t||t.date!=s.date||tm(t.from)>=tm(s.to)||tm(s.from)>=tm(t.to))return;
  x.rows.forEach(r=>{if(rk(r.r)==k)o.push(`${x.name} (الفرقة ${YN[t.yr]} · ${r.d}، ${r.n} طالب، ${trg(t.from,t.to)})`)})});return o}
function dup(room,e,d,skip=-1){const k=rk(room);return k?e.rows.filter((r,i)=>i!=skip&&r.d==d&&rk(r.r)==k):[]}
const ovl=(a,b)=>a.date==b.date&&tm(a.from)<tm(b.to)&&tm(b.from)<tm(a.to);
function clash(yr,d,key,so){return S.exams.filter(x=>{const t=sl(x.slot);return t&&t.yr==yr&&x.depts.includes(d)&&x.key!=key&&ovl(t,so)}).map(x=>x.name)}
function blocked(s,c=ui.pick){const p=c&&D.y[S.yr]?.[c.d]?.c[c.i];return p?clash(S.yr,c.d,norm(p[0]),s).length:0}
function markBlk(c){document.querySelectorAll(".slot").forEach(t=>{const b=!!(c&&blocked(sl(t.dataset.s),c));t.classList.toggle("blk",b);const z=t.querySelector(".dz");if(b&&z)z.textContent="⛔ تعارض: هذا القسم لديه امتحان آخر في نفس الوقت"})}
function dropExam(e,d){e.rows=e.rows.filter(r=>r.d!=d);e.depts=e.depts.filter(x=>x!=d);if(!e.depts.length)S.exams=S.exams.filter(x=>x!=e)}
function place(sid,d,i){const[name,prof]=D.y[S.yr][d].c[i],k=norm(name);let moved=false;const cl=clash(S.yr,d,k,sl(sid));if(cl.length){ui.pick=null;render();return say(`⛔ لا يمكن: ${d} (الفرقة ${YN[S.yr]}) لديهم امتحان "${cl[0]}" في نفس الوقت`,5000)}
 S.exams.slice().forEach(x=>{const s=sl(x.slot);if(s&&s.yr==S.yr&&x.key==k&&x.depts.includes(d)){dropExam(x,d);moved=true}});
 let e=S.exams.find(x=>x.slot==sid&&x.key==k);
 if(!e){e={id:uid(),slot:sid,key:k,name,profs:[],depts:[],rows:[]};S.exams.push(e)}
 else if(e.name.length>name.length&&!e.depts.length)e.name=name;
 e.depts.push(d);(e.names=e.names||{})[d]=name;(prof||"").split(" / ").filter(Boolean).forEach(p=>e.profs.includes(p)||e.profs.push(p));
 ui.add={e:e.id,d};ui.pick=null;save();render();
 say(e.depts.length>1?`تم دمج المادة مع ${e.depts.length-1} قسم/أقسام أخرى في خانة واحدة`:moved?"تم نقل المادة إلى هذا الموعد":"تمت الإضافة")}
function suggest(room,e,d){const k=rk(room),y=sl(e.slot).yr,rem=tot(d,y)-asg(e,d),df=S.def[y+d];let a=null,b=null;
 if(k)S.exams.forEach(x=>{const t=sl(x.slot);x.rows.forEach(r=>{if(rk(r.r)==k){b=r.n;if(t.yr==y&&r.d==d)a=r.n}})});
 const v=a??b??df,n=v?(rem>0?Math.min(v,rem):v):(rem>0?rem:"");return{n,v,src:a!=null?1:b!=null?2:0}}
function addcell(e,d,rem){const u=ui.add;
 if(u&&u.e==e.id&&u.d==d){const df=S.def[S.yr+d],sug=suggest("",e,d).n;
  return `<td colspan="2" class="np addc"><div class="af" data-e="${e.id}" data-d="${esc(d)}"><input class="rr" placeholder="القاعة" autocomplete="off"><input class="rn" type="number" min="1" value="${sug}"><button class="pri" data-a="addgo">إضافة</button><button class="x" data-a="addno">✕</button><div class="cm n">${df?"المقترح "+sug+" طالب (المعتاد لهذا القسم)":"اكتب القاعة وعدد الطلاب"}</div></div></td>`}
 return `<td colspan="2" class="np addc"><button class="ghost" data-a="addroom" data-e="${e.id}" data-d="${esc(d)}">+ قاعة${rem>0?" · باقي "+rem:""}</button></td>`}
function table(){
 const ss=yslots().sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));
 let h=`<table dir="rtl"><thead><tr><th colspan="8" class="tt">الفرقة ${YN[S.yr]}</th></tr><tr>${["اليوم","التاريخ","الوقت","اسم المادة","استاذ المادة","المكان","عدد الطلاب","القسم"].map(x=>`<th>${x}</th>`).join("")}</tr></thead>`;
 if(!ss.length)h+=`<tbody><tr><td colspan="8" class="empty" style="padding:40px">أضف موعداً من الأعلى (ولو موعداً واحداً مثل 09:00–12:00) ثم اسحب المواد من القائمة الجانبية إليه.</td></tr></tbody>`;
 const groups=[];ss.forEach(s=>{let g=groups[groups.length-1];if(!g||g.date!=s.date)groups.push(g={date:s.date,items:[]});g.items.push(s)});
 groups.forEach(g=>{let sh="",nrows=0;g.items.forEach((s,si)=>{const all=[],bl=blocked(s);
  S.exams.filter(x=>x.slot==s.id).forEach(e=>{const eg=[];
   e.depts.forEach(d=>{const rs=e.rows.map((r,i)=>({r,i})).filter(x=>x.r.d==d),a=asg(e,d),t=tot(d),rem=t-a;const sa=rem>0||!rs.length||(ui.add&&ui.add.e==e.id&&ui.add.d==d);
    const dc=`<td class="dp" rowspan="${rs.length+(sa?1:0)}">${esc(d)}<span class="chip ${rem==0?"ok":rem<0?"bad":"warn"}">${a}/${t}${rem>0?" · باقي "+rem:rem<0?" · زيادة "+-rem:" ✓"}</span><button class="x" data-a="deldept" data-e="${e.id}" data-d="${esc(d)}" title="حذف القسم من الامتحان">✕</button></td>`;
    rs.forEach((x,j)=>eg.push((ui.er&&ui.er.e==e.id&&ui.er.i==x.i?`<td><input class="er rr" data-e="${e.id}" data-d="${esc(x.r.d)}" data-i="${x.i}" data-o="${esc(x.r.r)}" value="${esc(x.r.r)}" placeholder="القاعة" autocomplete="off"></td><td><input class="en" type="number" min="1" value="${x.r.n}"><div><button class="pri" data-a="erok" style="padding:2px 10px">OK</button><button class="x" data-a="erno">✕</button></div><div class="en-note"></div></td>`:`<td>${esc(x.r.r)}${(()=>{const c=conf(x.r.r,e),du=dup(x.r.r,e,x.r.d,x.i);return du.length?`<span class="rw" title="القاعة مكررة لنفس القسم والفرقة في هذا الامتحان"> ⚠</span>`:c.length?`<span class="rw" title="${esc("القاعة مستخدمة في نفس الوقت بواسطة:\n"+c.join("\n"))}"> ⚠</span>`:""})()}<button class="x" data-a="editroom" data-e="${e.id}" data-i="${x.i}" title="تعديل القاعة والعدد">✎</button></td><td>${x.r.n}<button class="x" data-a="delrow" data-e="${e.id}" data-i="${x.i}">✕</button></td>`)+(j?"":dc)));
    if(sa)eg.push(addcell(e,d,rem)+(rs.length?"":dc))});
   eg.forEach((b,i)=>all.push((i?"":`<td class="nm" rowspan="${eg.length}">${esc(e.name)}<button class="x" data-a="delexam" data-e="${e.id}" title="حذف الامتحان">✕</button></td><td rowspan="${eg.length}"><input class="pf" list="pl" data-e="${e.id}" value="${esc(e.profs.join(" / "))}" placeholder="الأستاذ"></td>`)+b))});
  if(!all.length)all.push(`<td colspan="5" class="empty">اسحب مادة إلى هنا</td>`);
  nrows+=all.length+1;
  all.forEach((b,i)=>{
   sh+=`<tr class="slot${bl?" blk":""}${i||si?"":" first"}" data-s="${s.id}">${i||si?"":"@@DAY@@"}${i?"":`<td class="tm" rowspan="${all.length+1}">${trg(s.from,s.to)}<button class="x" data-a="delslot" data-s="${s.id}" title="حذف الموعد">✕</button></td>`}${b}</tr>`});

 SIG_SHEETS.forEach(([l,ds],i)=>{if(buckets[i].length)sheets.push({name:l,xml:sigSheet(l,buckets[i],ds.length>1).xml()})});
 extra.forEach((rs,d)=>sheets.push({name:d.replace(/[\[\]:*?\/\\]/g,"").slice(0,31)||"قسم",xml:sigSheet(d,rs,false).xml()}));
 dl(xlsxPack(sheets),"exams_control_signatures_by_department.xlsx");
 say(extra.size?`تم التنزيل — أقسام غير معروفة أُضيفت في أوراق مستقلة: ${[...extra.keys()].join("، ")}`:"تم تنزيل كشوف التوقيعات",extra.size?6000:2600)}

body{font-family:"Noto Naskh Arabic","Scheherazade New","Arial",serif;direction:rtl;font-size:14pt;color:#111}

function printDoc(html){const f=document.createElement("iframe");f.style.cssText="position:fixed;left:-10000px;top:0;width:297mm;height:210mm;border:0";
 f.onload=async()=>{const w=f.contentWindow;try{await f.contentDocument.fonts.ready}catch(e){}w.addEventListener("afterprint",()=>setTimeout(()=>f.remove(),500));w.focus();w.print()};
 f.srcdoc=html;document.body.appendChild(f);setTimeout(()=>f.isConnected&&f.remove(),600000)}
function printCovers(){const R=packRecs();if(!R.length)return say("لا توجد امتحانات موزعة على قاعات لإنشاء أغلفتها");
 const logo=P.logo?`<img src="${esc(P.logo)}" alt="logo">`:"",
 fr=(a,x,b,y)=>`<div class="field-row"><div class="field"><span class="field-label">${a}:</span><span class="field-value">${x}</span></div><div class="field"><span class="field-label">${b}:</span><span class="field-value">${y}</span></div></div>`;
 const pages=R.map(x=>`<section class="cover"><div class="top-bar"><div class="institute">وزارة التعليم العالي<br>المعهد التكنولوجي العالي بني سويف<br>قرار وزاري (1964)</div><div class="logo-box">${logo}</div><div class="dept-box">القسم: ${esc(x.dept)}<br>الفرقة: ${YN[x.yr]}</div></div><div class="main-title">${esc(P.title)}</div><div class="fields">${fr("اسم المقرر",esc(x.subject),"التاريخ",fd(x.date))}${fr("دكتور المقرر",esc(x.prof),"اليوم",dn(x.date))}${fr("القاعة",esc(x.room),"الساعة",trg(x.from,x.to))}${fr("عدد النسخ",x.n,"عدد الطلاب","")}</div></section>`).join("");
 say("جاري تجهيز الأغلفة… اختر «حفظ بصيغة PDF» من نافذة الطباعة",5000);
 printDoc(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>exam-covers</title><style>${COVER_CSS}</style></head><body>${pages}</body></html>`)}
function pkRender(){const n=packRecs().length,miss=S.exams.reduce((a,e)=>a+e.depts.filter(d=>!e.rows.some(r=>r.d==d)).length,0);
 $("#pk").innerHTML=`<div class="pkc"><div class="pkh"><b>كشوف التوقيعات وأغلفة الامتحانات</b><button class="x" data-a="pkx">✕</button></div>${miss?`<div class="pkw">⚠ ${miss} مادة/قسم بدون قاعات مسجلة، ولن تظهر في الكشوف ولا في الأغلفة</div>`:""}
 <section><h4>كشوف توقيع المراقبين</h4><p>ملف Excel بورقة لكل قسم (ميكاترونكس، طاقة، برمجة، شبكات) مقسّمة حسب اليوم والفترة. ${n} لجنة (قاعة).</p><button class="pri" data-a="sigx"${n?"":" disabled"}>تنزيل ملف Excel</button></section>
 <section><h4>أغلفة الامتحانات</h4><p>غلاف A4 أفقي لكل قاعة (${n} غلاف) لجميع الفرق.</p>
 <label>عنوان الغلاف<input id="pkT" value="${esc(P.title)}"></label>
 <div class="pkl">الشعار:${P.logo?` <img src="${esc(P.logo)}" alt="logo"><button class="x" data-a="logod">حذف</button>`:""}<input type="file" id="pkF" accept="image/*"></div>
 <button class="pri" data-a="cvr"${n?"":" disabled"}>إنشاء الأغلفة (طباعة / حفظ PDF)</button><p>في نافذة الطباعة اختر «حفظ بصيغة PDF» وتأكد أن الورق A4 أفقي والهوامش «افتراضي».</p></section></div>`}
function xlRender(){$("#xl").innerHTML=`<div class="pkc"><div class="pkh"><b>تصدير جدول الامتحانات (Excel)</b><button class="x" data-a="xlx">✕</button></div>
 <section><h4>شعار المعهد</h4><p>يظهر في منتصف رأس كل ورقة. اختياري — اتركه فارغاً لتصدير الجدول بدون شعار.</p>
 <div class="pkl">الشعار:${P.logo?` <img src="${esc(P.logo)}" alt="logo"><button class="x" data-a="xlogod">حذف</button>`:" <span>لم يتم اختيار شعار</span>"}<input type="file" id="xlF" accept="image/*"></div>
 <button class="pri" data-a="xlgo">تنزيل ملف Excel</button></section></div>`}
document.addEventListener("click",ev=>{const t=ev.target;if(t.id=="pk"||t.id=="xl")return t.classList.remove("on");const b=t.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="xlx")$("#xl").classList.remove("on");else if(a=="xlgo"){$("#xl").classList.remove("on");exportXLSX()}else if(a=="xlogod"){P.logo="";savePk();xlRender();pkRender()}else if(a=="pk"){pkRender();$("#pk").classList.add("on")}else if(a=="pkx")$("#pk").classList.remove("on");else if(a=="sigx")exportSigs();else if(a=="cvr")printCovers();else if(a=="logod"){P.logo="";savePk();pkRender()}});
document.addEventListener("keydown",ev=>{if(ev.key=="Escape"){$("#pk").classList.remove("on");$("#xl").classList.remove("on")}});
document.addEventListener("input",ev=>{if(ev.target.id=="pkT"){P.title=ev.target.value;savePk()}});
document.addEventListener("change",ev=>{const i=ev.target,f=(i.id=="pkF"||i.id=="xlF")&&i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{let out=r.result;try{const nh=im.naturalHeight||330,nw=im.naturalWidth||330,h=Math.min(330,nh),cv=document.createElement("canvas");cv.width=Math.round(nw*h/nh);cv.height=h;cv.getContext("2d").drawImage(im,0,0,cv.width,h);out=cv.toDataURL("image/png")}catch(e){}P.logo=out;savePk();pkRender();xlRender()};
  im.onerror=()=>say("تعذر قراءة ملف الصورة");im.src=r.result};r.readAsDataURL(f);i.value=""});
render();
